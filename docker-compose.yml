version: "3.9"

services:

  # ================================
  # PostgreSQL 16
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: yapeseguro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yapeseguro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yapeseguro_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Redis 7 — cache + rate limiting
  # ================================
  redis:
    image: redis:7-alpine
    container_name: yapeseguro-redis
    restart: unless-stopped
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # RabbitMQ 3 — mensajes asíncronos
  # ================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: yapeseguro-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ================================
  # Spring Boot App
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yapeseguro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/yapeseguro_db
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: change-this-to-a-very-long-base64-encoded-secret-in-production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
