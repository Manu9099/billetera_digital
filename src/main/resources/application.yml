server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: yapeseguro-backend



  # ================================
  # DATASOURCE - PostgreSQL
  # ================================
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/yapeseguro_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: YapeSeguroPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ================================
  # JPA / HIBERNATE
  # ================================
  jpa:
    hibernate:
      ddl-auto: validate       # Flyway maneja el schema — NO usar create/update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: yape
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ================================
  # FLYWAY — migraciones versionadas
  # ================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: yape
    default-schema: yape

  # ================================
  # REDIS — cache + rate limiting
  # ================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  # ================================
  # RABBITMQ — mensajes asíncronos
  # ================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3

  # ================================
  # MAIL — comprobantes y alertas
  # ================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ================================
# JWT CONFIGURATION
# ================================
yapeseguro:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-min-32-chars-change-in-production}
    expiration-ms: 86400000        # 24 horas
    refresh-expiration-ms: 604800000  # 7 días

  # Marketplace hold — días antes de liberar automáticamente
  marketplace:
    default-hold-days: 7
    max-hold-days: 30

  # Rate limiting
  rate-limiting:
    transactions-per-minute: 10
    login-attempts-per-hour: 5

  # External Services
  culqi:
    api-key: ${CULQI_API_KEY:}
    base-url: https://api.culqi.com/v2

  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

# ================================
# SPRINGDOC / SWAGGER
# ================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# ================================
# ACTUATOR — health checks
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ================================
# LOGGING
# ================================
logging:
  level:
    com.yapeseguro: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
